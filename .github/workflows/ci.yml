name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Blog source check
        run: npm run blog:check
      - name: Blog validate
        run: npm run blog:validate
      - name: Glossary strict
        run: npm run lint:glossary:strict
      - name: Test
        run: npm test
      - name: Site search golden-query guard
        run: npm run lint:search-baseline
      - name: Catalog keyword golden-query guard
        run: npm run lint:catalog-baseline
      - name: Discovery parity guard
        run: npm run lint:discovery-baseline
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - name: Build GitHub Pages base path
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: "/intobadminton"

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - name: Lighthouse CI
        run: |
          npx -y serve@latest out -l 4173 &
          sleep 2
          npm run lint:lighthouse
      - name: Lighthouse baseline regression guard
        run: npm run lint:lighthouse:baseline
      - name: CrUX field-data baseline guard
        run: npm run lint:crux-baseline
      - name: GSC performance baseline guard
        run: npm run lint:gsc-baseline

  e2e-quiz:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: E2E smoke tests
        run: npx playwright test
        env:
          CI: "true"
