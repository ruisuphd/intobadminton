name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build (apex domain, no basePath)
        run: npm run build
        env:
          # Apex custom domain → no base path. The custom domain is read from
          # public/CNAME, which Next copies into the export output.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://intobadminton.com"
          NEXT_PUBLIC_ADSENSE_CLIENT: "ca-pub-9641207581771694"
          NEXT_PUBLIC_ADSENSE_MODE: "disabled"
          NEXT_PUBLIC_BUTTONDOWN_USERNAME: "yoryouyoi"
          NEXT_PUBLIC_REACTIONS_API_URL: ${{ secrets.REACTIONS_API_URL }}

      - name: Disable Jekyll on Pages
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
