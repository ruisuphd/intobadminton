name: Reactions worker health

# Weekly smoke for the HelpfulReaction Cloudflare Worker when the owner has
# configured REACTIONS_API_URL. Skips gracefully when the secret is unset.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Health smoke
        env:
          REACTIONS_API_URL: ${{ secrets.REACTIONS_API_URL }}
        run: |
          if [ -z "$REACTIONS_API_URL" ]; then
            echo "REACTIONS_API_URL not configured — skipping weekly health smoke"
            exit 0
          fi
          npm run reactions:smoke
